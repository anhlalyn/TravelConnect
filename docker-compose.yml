version: "3.8"

services:
  # ==========================================
  # Database Service (MySQL)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: travelconnect-db
    restart: always
    environment:
      MYSQL_DATABASE: travelconnect
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Tự động nạp schema và dữ liệu mẫu khi tạo database lần đầu
      - ./database/travelconnect.sql:/docker-entrypoint-initdb.d/travelconnect.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # Production Web Service (Gộp chung Front & Back)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelconnect-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASS: ""
      DB_NAME: travelconnect
      JWT_SECRET: travelconnect-secret
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount thư mục uploads chứa hình ảnh mẫu của database
      - ./backend/uploads:/app/uploads

  # ==========================================
  # Development Backend Service (Chạy Hot-Reload)
  # ==========================================
  backend-dev:
    image: node:20-alpine
    container_name: travelconnect-backend-dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASS: ""
      DB_NAME: travelconnect
      JWT_SECRET: travelconnect-secret
      CLIENT_URL: http://localhost:5173
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules # Tránh ghi đè node_modules của container bằng thư mục trống ở máy host

  # ==========================================
  # Development Frontend Service (Vite Dev Server)
  # ==========================================
  frontend-dev:
    image: node:20-alpine
    container_name: travelconnect-frontend-dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
      - VITE_APP_BASE_URL=http://localhost:3000
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
